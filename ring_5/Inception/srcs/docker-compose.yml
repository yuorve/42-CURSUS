volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: data/mariadb
      o: bind
      type: none
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: data/wordpress
      o: bind
      type: none

networks:
  inception:
    name: inception
    driver: bridge

services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/
    volumes:
      - mariadb:/var/lib/mysql
    env_file:
      - .env
    networks:
      - inception
    restart: unless-stopped
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-content/themes/variations/readme.txt"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 45s
      start_interval: 5s
    depends_on:
      - mariadb
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env
    networks:
      - inception
    restart: unless-stopped
  nginx:
    container_name: nginx
    build: ./requirements/nginx/
    ports:
      - "443:443"
    depends_on:
      wordpress:
        condition: service_healthy        
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: unless-stopped
